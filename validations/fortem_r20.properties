# ==============================================================================
# FORTEM TRUEVIEW R20 RADAR SENSOR PROFILE (fortem_r20.properties)
# ==============================================================================
# Sensor configuration profile for real-world drone surveillance using the
# Fortem TrueView R20 compact phased-array radar (AERPAW / AADM 2025 Dryad Dataset).
#
# Hardware & Physical Operating Environment:
#   - Frequency: 15 GHz (Ku-band active electronically scanned array)
#   - Dwell / Coherent Processing Interval (CPI): 0.256 s (~3.9 Hz update rate)
#   - Surveillance Target Range: ~650 m to 800 m line-of-sight
#   - Angular Resolution & Geometric Dispersion:
#       * Azimuth std dev (sigma_azimuth) ~ 1.2 to 2.5 deg (~15 m cross-range at 650 m)
#       * Elevation std dev (sigma_elevation) ~ 3.0 to 6.0 deg (~60 m vertical at 650 m)
#       * Consequently, measurement uncertainty is strongly ELLIPSOIDAL:
#         R = diag(sigma_xy^2, sigma_xy^2, sigma_z^2) = diag(15^2, 15^2, 60^2).
# ==============================================================================

[scan]
# Radar antenna scan batching dwell window (in seconds).
# In the TrueView R20, detections belonging to the same CPI sweep (CPI = 0.256 s)
# share identical params.globalTime. Setting scan_window_s = 0.10 s groups simultaneous
# antenna beam detections while keeping consecutive CPI updates distinct.
scan_window_s = 0.10

# Nominal radar update period (in seconds).
# Matches the radar hardware CPI (0.256 s) recorded in params.cpi.
nominal_scan_period_s = 0.256


[lifecycle]
# Maximum duration (in seconds) to coast a track across radar dropouts.
# At ~650 m range, small UAVs frequently undergo brief tangential Doppler nulls
# or multipath fades lasting 2 to 6 seconds (8 to 24 CPI scans). A 10.0 s coasting
# horizon bridges up to ~39 missed scans without track fragmentation.
max_coast_s = 10.0

# Minimum detections required to confirm a track in high-cadence 3.9 Hz radar data.
# With CPI = 0.256 s (~3.9 scans/s), requiring 12 hits corresponds to ~3.0 seconds of sustained
# kinematic consistency (matching the 3-4 s confirmation horizon of 4 hits at 1 Hz / 60 RPM),
# acquiring UAVs earlier while still filtering out transient bird and tree-sway bursts.
min_confirmed_hits = 12

# Initial track certainty score (0-100 scale).
# Follows the exact task.md certainty specification: starts at 30.0 (below confirmation threshold)
# so isolated clutter returns remain strictly unconfirmed.
initial_certainty = 30.0

# Certainty score increment per associated radar detection.
# Follows the exact task.md certainty specification (+30.0 per new detection).
certainty_hit_increment = 30.0

# Certainty score penalty per missed radar scan, scaled to the 0.256 s (3.9 Hz) CPI cadence.
# At 1 Hz (60 RPM), -10.0/scan corresponds to a time-decay rate of -10.0 points/second.
# At 3.9 Hz (CPI = 0.256 s), -10.0/scan would equal -39.1 points/second, killing a new track
# in just 3 scans (0.77 s) and an established track (certainty 100) in 2.56 s (rendering
# max_coast_s = 10.0 s unreachable). Scaling to 3.0 points/scan (~11.7 points/s) preserves
# the ~2.5 s survival window for new seeds and ~8.5 s coasting window for confirmed tracks.
certainty_miss_penalty = 3.0

# Maximum upper bound cap for the certainty score (never exceeds 100).
max_certainty = 100.0

# Confirmation threshold on the certainty score.
confirmation_certainty_threshold = 70.0


[gating]
# Physical maximum horizontal velocity (in m/s) allowed for established tracks.
# 160.0 m/s (~576 km/h) covers high-speed fixed-wing UAVs and rapid drone dives.
max_speed_xy_mps = 160.0

# Physical maximum vertical climb/descent velocity (in m/s) allowed for established tracks.
# Set to 450.0 m/s to accommodate the wide elevation beam jitter (sigma_z = 60 m over dt = 0.256 s
# produces instantaneous vertical velocity noise ~ 60 / 0.256 = 234 m/s).
max_speed_z_mps = 450.0

# Initial horizontal speed gate (in m/s) for 1st-to-2nd plot pairing.
# Restricts initial track spawning to physically plausible UAV velocities (< 90 m/s),
# preventing pairs of distant clutter returns from forming phantom tracks.
init_speed_xy_mps = 90.0

# Initial vertical speed gate (in m/s) for 1st-to-2nd plot pairing.
init_speed_z_mps = 350.0

# Statistical 3D Mahalanobis innovation distance gate.
# Set to 3.0 sigma (~97% chi^2_3 coverage) to absorb 3.9 Hz cross-range azimuth glint
# and short dropout re-acquisitions without losing track continuity.
mahalanobis_gate = 3.0

# Base 3D metric prediction error gate (in meters) at dt = nominal_scan_period_s (0.256 s).
# At 650 m range with sigma_xy = 15 m, a ~2.67-sigma gate radius corresponds to 40.0 m.
base_pred_err_m = 40.0

# Metric gate expansion per second of coasting (in m/s).
# Allows +5.0 m/s of additional prediction uncertainty across multi-scan radar fades.
pred_err_slope_mps = 5.0

# Cost penalty added to tentative tracks in the Hungarian assignment matrix.
# Sized to 40.0 (equivalent to 40 m of metric error) to strictly prioritize established
# confirmed drone tracks over newly spawned clutter seeds.
tentative_cost_penalty = 40.0

# Unassigned dummy track cost threshold.
unassigned_cost_threshold = 500.0


[kalman]
# Horizontal measurement standard deviation (East and North, in meters).
# Ground-truth verified against Fortem R20 radar logs at 650 m: cross-range error std dev is ~15 m.
sigma_pos_xy_m = 15.0

# Vertical (altitude) measurement standard deviation (Up axis, in meters).
# Ku-band phased-array broad elevation beam at 650 m: elevation noise std dev is ~60 m.
sigma_pos_z_m = 60.0

# Continuous white-noise horizontal acceleration spectral density std dev (in m/s^2).
# Low-maneuver straight-line GPS waypoint flight in Opt2: smooth acceleration ~ 0.6 m/s^2.
sigma_accel_xy = 0.6

# Continuous white-noise vertical acceleration spectral density std dev (in m/s^2).
sigma_accel_z = 0.5


[kinematics]
# Post-processing smoothing pipeline for high-cadence 4 Hz radar data.
# Pipeline 06 (huber_kalman_rts) combines Huber IRLS outlier resistance with RTS
# forward-backward Kalman smoothing in a single unified state-space pass.
kinematic_filter_method = huber_kalman_rts
median_window_size = 9
speed_outlier_rel_tol = 0.25
smooth_neighbor_radius = 2
max_heading_diff_deg = 25.0
output_decimals = 2
