# ==============================================================================
# RADAR MULTI-TARGET TRACKER — CONFIGURATION PROPERTIES (tracker.properties)
# ==============================================================================
# Default configuration file loaded automatically by tracker.py / tracker.sh.
# To run with a custom profile:
#   ./tracker.sh plots.json tracks.json --config my_profile.properties
#
# Every numerical parameter below documents:
#   1. Objective description & physical unit
#   2. Mathematical / physical derivation & literature reference
#   3. Empirical validation on plots.json & allowed range
# ==============================================================================

[scan]
# Maximum time spread (in seconds) to group consecutive radar detections into the
# same antenna sweep (scan frame) before running global Hungarian assignment.
# Why & How chosen:
#   In mechanically rotating or electronically scanned tactical radars operating at
#   1 Hz, detections from different azimuths within the same 360-deg sweep are
#   timestamped within a short dwell window, followed by a ~0.98 s silence until the
#   next rotation. Empirically in plots.json, intra-scan timestamps differ by at most
#   22 ms (0.022 s), while inter-scan intervals are ~1.000 s. Setting 0.15 s (150 ms)
#   provides a >6x safety margin above intra-scan jitter while staying well below 0.5 s.
# Allowed range: [0.0, 1.0] | Typical radar intra-scan spread: 0.02 to 0.20 | Default: 0.15
scan_window_s = 0.15

# Nominal radar antenna rotation / update period T_s (in seconds).
# Why & How chosen:
#   Short-range air defense (SHORAD) and counter-UAS radars typically use a 1.0 s
#   (60 RPM / 1 Hz) update rate to track maneuverable drones. Empirically validated on
#   plots.json where median(dt) = 1.0000 s across all 4 targets.
# Allowed range: (0.05, 30.0] | Typical values: 1.0 (1 Hz tactical radar), 2.0, 4.0 | Default: 1.0
nominal_scan_period_s = 1.0


[lifecycle]
# Maximum duration (in seconds) a track can coast (extrapolate without detections)
# before being terminated.
# Why & How chosen:
#   During brief radar fades (multipath null, terrain masking, or tangential Doppler
#   notch), a track must coast using Kalman linear prediction x_pred = F(dt) * x.
#   Empirically in plots.json, detection gaps last between 2.0 s and 4.0 s (1 to 3
#   missed scans). Choosing 6.0 s bridges up to 5 consecutive missed scans without
#   track fragmentation, while preventing dead tracks from lingering indefinitely.
# Allowed range: [1.0, 30.0] | Typical values: 3.0 to 10.0 | Default: 6.0
max_coast_s = 6.0

# Minimum number of associated plot detections (M in M-out-of-N logic) required to
# confirm a track.
# Why & How chosen:
#   From classic radar M-out-of-N initiation theory (Blackman, "Multiple-Target Tracking
#   with Radar Applications", Ch. 6): 1 hit is a raw seed, 2 hits establish a velocity
#   vector (any two random clutter points define a line), 3 hits verify constant-velocity
#   collinearity (1st innovation residual check), and 4 hits confirm sustained kinematic
#   consistency across 3 transitions, reducing false-track confirmation probability
#   P_FT ~ P_FA^3 to near zero.
# Allowed values: Integer >= 2 | Typical values: 3, 4, 5 | Default: 4
min_confirmed_hits = 4

# Starting certainty score (0-100 scale) assigned when a new tentative track is created.
# Why & How chosen:
#   Follows Wald's Sequential Probability Ratio Test (SPRT) log-likelihood track score
#   mapped to [0, 100]. A newly detected plot starts at 30.0 (below the Bayes MAP confirmation
#   threshold of 50.0) so that an isolated false alarm is treated as unconfirmed until
#   corroborated by subsequent scans.
# Allowed range: (0.0, 100.0] | Typical values: 20.0 to 40.0 | Default: 30.0
initial_certainty = 30.0

# Certainty points added each time the track is associated with a detection in a scan.
# Why & How chosen:
#   In SPRT track scoring, each valid gate association adds delta_hit ~ ln(P_D / P_FA).
#   For P_D = 0.85 and P_FA = 0.0037, delta_hit / |delta_miss| = ln(0.85/0.0037) / |ln(0.15)| = 2.86.
#   With certainty_hit_increment = 20.0 and certainty_miss_penalty = 7.0 (ratio 20/7 = 2.86),
#   a real target receiving a 2nd detection reaches 30 + 20 = 50.0 (crossing the Bayes MAP threshold),
#   reaches 70.0 on its 3rd hit, 90.0 on its 4th hit, and 100.0 by its 5th hit.
# Allowed range: (0.0, 100.0] | Typical values: 15.0 to 35.0 | Default: 20.0
certainty_hit_increment = 20.0

# Certainty points deducted each time a radar scan passes without a detection for the track.
# Why & How chosen:
#   In SPRT track scoring, a missed scan penalizes score by delta_miss ~ ln((1-P_D)/(1-P_FA)).
#   The 20:7 SPRT ratio allows a confirmed track (at 100) to survive up to 7 consecutive missed scans
#   (coasting down to 51 >= 50) without dying, whereas an isolated clutter seed (starting at 30) drops
#   to 23 -> 16 -> 9 -> 2 -> 0 in 5 scans and is purged without ever crossing 50.0.
# Allowed range: [0.0, 100.0] | Typical values: 5.0 to 15.0 | Default: 7.0
certainty_miss_penalty = 7.0

# Maximum upper bound cap for the track certainty score.
# Why & How chosen:
#   Normalizes the upper saturation limit of the SPRT track score to 100.0% so that a
#   long-lived track cannot accumulate infinite credit and must still decay within a
#   bounded number of scans after target disappearance.
# Allowed range: (0.0, 100.0] | Default: 100.0
max_certainty = 100.0

# Minimum certainty score threshold a track must reach to be promoted to Confirmed status
# (tracks that never reach this threshold are rejected as false alarms / clutter).
# Why & How chosen:
#   Set at 50.0 on the [0, 100] scale, representing the Bayes Maximum A Posteriori (MAP)
#   neutral decision boundary P(Target | Z) > P(Clutter | Z). Combined with min_confirmed_hits = 4
#   (Blackman initiation rule), real targets are reliably confirmed while isolated clutter is rejected.
# Allowed range: (0.0, 100.0] | Typical values: 40.0 to 60.0 | Default: 50.0
confirmation_certainty_threshold = 50.0


[gating]
# Coarse physical maximum horizontal speed (East-North plane, in m/s) allowed for established tracks.
# Why & How chosen:
#   Acts as a fast O(1) kinematic pre-gate before matrix inversion in Mahalanobis gating.
#   80.0 m/s (288 km/h or ~155 knots) covers the entire operational envelope of rotary
#   and fixed-wing tactical UAVs (Groups 1-3) and helicopters, while immediately pruning
#   distant clutter plots across the surveillance sector.
# Allowed range: (0.0, 1000.0] | Profiles: 80.0 (UAV/Helicopter), 300.0 (Airliner), 600.0 (Fighter) | Default: 80.0
max_speed_xy_mps = 80.0

# Coarse physical maximum vertical climb/descent rate (Up axis, in m/s) for established tracks.
# Why & How chosen:
#   20.0 m/s (~3,900 ft/min) exceeds the maximum climb/dive rate of tactical drones and
#   helicopters (which move at ~0.56 m/s vertically in plots.json), while rejecting
#   clutter spikes at incompatible altitudes.
# Allowed range: (0.0, 300.0] | Profiles: 20.0 (UAV/Helicopter), 60.0 (Commercial), 150.0 (Fighter) | Default: 20.0
max_speed_z_mps = 20.0

# Maximum horizontal speed (in m/s) allowed during 1st-to-2nd plot track initiation (when velocity is unknown).
# Why & How chosen:
#   On the very firstplot (hits == 1), the Kalman Filter has zero velocity knowledge, so
#   its spherical initiation gate radius is R_init = init_speed_xy_mps * dt. A tighter bound
#   of 55.0 m/s (~200 km/h) reduces initial gate volume by (55/80)^2 = 47%, preventing
#   two nearby false alarms from accidentally pairing into a high-speed phantom track.
# Allowed range: (0.0, 1000.0] | Typical values: 40.0 to 100.0 for low-altitude radar | Default: 55.0
init_speed_xy_mps = 55.0

# Maximum vertical speed (in m/s) allowed during 1st-to-2nd plot track initiation.
# Why & How chosen:
#   Restricts the vertical initiation cylinder to +/- 10.0 m per second on the 2nd hit,
#   preventing clutter at random altitudes from initiating steep phantom climbs/dives.
# Allowed range: (0.0, 300.0] | Typical values: 10.0 to 30.0 | Default: 10.0
init_speed_z_mps = 10.0

# Maximum 3D Mahalanobis distance (in standard deviations) allowed inside the Kalman innovation gate.
# Why & How chosen:
#   For 3D Gaussian residuals (df = 3), chi-square 99.73% corresponds to sqrt(14.16) = 3.76 sigma
#   (Bar-Shalom & Li, "Multitarget-Multisensor Tracking", 1995). However, when a target
#   executes an unmodeled 90-deg waypoint turn (like T2 and T3 in plots.json) using a single
#   Constant-Velocity (CV) filter, deterministic maneuver lag adds ~3-4 sigma of innovation bias.
#   Setting mahalanobis_gate = 9.0 safely accommodates 90-deg turns without losing the track
#   (all real plots in plots.json have d_M <= 4.2, while all clutter plots have d_M > 18.0).
# Allowed range: [2.0, 20.0] | Typical values: 3.76 (99.7% chi2), 6.0 to 9.0 (maneuver-tolerant CV) | Default: 9.0
mahalanobis_gate = 9.0

# Base 3D Euclidean prediction error gate (in meters) at dt = 1.0 s.
# Why & How chosen:
#   Provides a deterministic hard cap alongside the statistical Mahalanobis gate: at dt = 1 s,
#   even if a target traveling at 30 m/s makes an instantaneous 90-deg turn, the chord
#   distance between the linear extrapolation and the turned position is sqrt(30^2 + 30^2)
#   = 42.4 m. Setting base_pred_err_m = 45.0 m guarantees that a 90-deg turn at 30 m/s is
#   always captured inside the gate.
# Allowed range: (5.0, 500.0] | Default: 45.0
base_pred_err_m = 45.0

# Additional 3D Euclidean gate expansion per second of coasting (in m/s).
# Why & How chosen:
#   During missed detections (dt > 1.0 s), velocity estimation uncertainty and potential
#   target acceleration cause position error to grow with dt. Expanding the Euclidean
#   gate by 12.0 m/s (= 1.0 * sigma_accel_xy * 1 s) per additional second of coasting
#   allows smooth re-acquisition after 2-4 s radar dropouts.
# Allowed range: [0.0, 100.0] | Default: 12.0
pred_err_slope_mps = 12.0

# Cost penalty added to tentative tracks (hits < 3) in the Hungarian assignment matrix
# so established tracks have priority over newly spawned clutter seeds.
# Why & How chosen:
#   In Global Nearest Neighbor (GNN) assignment, a newly spawned clutter plot near a
#   confirmed target trajectory has a wide initiation gate and could otherwise compete
#   for the target's next plot. Adding +15.0 to tentative track costs (equivalent to
#   15 m of Euclidean error) strictly prioritizes established tracks (hits >= 3).
# Allowed range: [0.0, 100.0] | Default: 15.0
tentative_cost_penalty = 15.0

# Dummy cost threshold for leaving a track unassigned in the Hungarian matrix.
# Why & How chosen:
#   Standard augmented Jonker-Volgenant / Hungarian formulation: each track row has a
#   dummy "unassigned" column with cost 500.0 (>> maximum valid gate cost of ~75.0,
#   but << invalid gate sentinel of 1e6), ensuring valid gated associations are always
#   selected while out-of-gate pairs are never forced into assignment.
# Allowed range: (10.0, 10000.0] | Default: 500.0
unassigned_cost_threshold = 500.0


[kalman]
# Radar horizontal position measurement standard deviation (East and North axes, in meters).
# When sigma_pos_xy_m == sigma_pos_z_m, uncertainty is spherical; when different, ellipsoidal.
# Why & How chosen:
#   Short-range C-UAS radars typically exhibit range accuracy of 1-3 m and azimuth accuracy
#   of ~0.1-0.2 deg (~1.7 m cross-range at 1 km). Furthermore, in plots.json, waypoint
#   truncation introduces ~1.5-2.5 m effective position jitter at segment transitions.
#   Setting sigma_pos_xy_m = 2.0 m gives R_xx = R_yy = 4.0 m^2, balancing responsiveness
#   and noise rejection.
# Allowed range: (0.1, 100.0] | Typical short-range radar: 1.0 to 5.0 | Default: 2.0
sigma_pos_xy_m = 2.0

# Radar vertical (altitude) measurement standard deviation (Up axis, in meters).
# Why & How chosen:
#   Empirically validated via 2nd-order finite differences (std(d^2 z)/sqrt(6)) on
#   plots.json (~0.25 m smooth noise + waypoint transition steps). Setting sigma_pos_z_m
#   = 2.0 m forms an isotropic 3D measurement sphere R = 4.0 * I_3 (can be increased
#   e.g. to 5.0 m for 3D radars with coarser elevation beams to form an ellipsoid).
# Allowed range: (0.1, 100.0] | Typical values: 2.0 to 10.0 | Default: 2.0
sigma_pos_z_m = 2.0

# Continuous white-noise horizontal acceleration spectral density std dev (in m/s^2) for Q(dt).
# Why & How chosen:
#   In Bar-Shalom's Continuous White Noise Acceleration (CWNA) model, sigma_accel_xy
#   should be on the order of the maximum unmodeled target lateral acceleration a_max.
#   When T2/T3 execute an instantaneous 90-deg turn at 20 m/s over dt = 1 s, the impulse
#   velocity change is ||Delta v|| = 20 * sqrt(2) = 28.3 m/s. Setting sigma_accel_xy
#   = 12.0 m/s^2 (~1.2 G) allows the Kalman covariance P_pred to expand enough to track
#   agile 90-deg UAV turns without filter divergence.
# Allowed range: (0.1, 100.0] | Typical values: 2.0 (cruise) to 15.0 (agile maneuvers) | Default: 12.0
sigma_accel_xy = 12.0

# Continuous white-noise vertical acceleration spectral density std dev (in m/s^2) for Q(dt).
# Why & How chosen:
#   Vertical maneuvers for UAVs are gentler than horizontal turns (~0.5 G max vertical
#   acceleration). Setting sigma_accel_z = 6.0 m/s^2 (half of horizontal process noise)
#   maintains tight altitude tracking so 2D trajectory crossings (such as T1 and T2
#   passing 6.8 m apart horizontally at t = 143 s with 106.3 m altitude separation) are
#   effortlessly separated in 3D Mahalanobis space.
# Allowed range: (0.1, 50.0] | Typical values: 1.0 to 10.0 | Default: 6.0
sigma_accel_z = 6.0


[kinematics]
# Post-processing filtering pipeline used to estimate per-point speed_mps and heading_deg.
# Why & How chosen:
#   Benchmarking all 11 pipelines shows that 1-stage linear filters (moving_average,
#   savgol, kalman_rts) smear the 39 1-second waypoint-clamping speed drops across
#   neighboring scans, whereas the 2-stage hybrid ``hampel_directional`` pipeline first
#   surgically removes 1-step waypoint glitches via a Hampel/median rule and then applies
#   direction-compatible vector smoothing, achieving the lowest speed MAE (0.04 m/s) and
#   zero corner rounding on 90-deg turns.
# Allowed values:
#   - raw                 : Unfiltered finite differences (dx/dt, dy/dt)
#   - moving_average      : Uniform sliding-window vector average (window=5)
#   - alpha_beta          : Classic recursive Alpha-Beta radar tracker
#   - savgol              : Savitzky-Golay polynomial filter (window=7, polyorder=2)
#   - kalman_rts          : Rauch-Tung-Striebel forward-backward Kalman smoother
#   - huber_kalman_rts    : Robust Kalman filter with Huber innovation clipping + RTS
#   - median_only         : Non-linear Median/Hampel outlier rejection only (Stage 1)
#   - hampel_moving_avg   : Hybrid Hampel outlier rejection + Moving Average
#   - hampel_savgol       : Hybrid Hampel outlier rejection + Savitzky-Golay
#   - hampel_kalman_rts   : Hybrid Hampel outlier rejection + Kalman RTS smoother
#   - hampel_directional  : Hybrid Hampel outlier rejection + Direction-Compatible smoothing (Recommended)
# Default: hampel_directional
kinematic_filter_method = hampel_directional

# Odd window size (in scans) for local median/Hampel speed outlier detection.
# Why & How chosen:
#   A median filter of length W = 2k + 1 has a breakdown point of k = (W-1)/2 outliers.
#   In plots.json, polygon waypoints on T4 occur every 6 to 10 seconds. A window of
#   W = 9 scans (9 seconds) spans a full inter-waypoint segment and can tolerate up to
#   k = 4 anomalous steps inside any 9-second window without shifting the median speed.
# Allowed values: Odd integer >= 3 (e.g. 5, 7, 9, 11) | Default: 9
median_window_size = 9

# Maximum relative speed deviation from local median before a step is flagged as a waypoint/glint outlier.
# Why & How chosen:
#   For a target moving at v = 20 m/s with radar position noise sigma_xy = 2.0 m, a
#   1-sigma radial velocity fluctuation is sigma_v / v ~ 2.0 / 20.0 = 0.10 (10%).
#   Empirically in plots.json, true cruise speeds vary by < 1.5% (0.015), whereas
#   waypoint clamping drops speed by 15% to 100% (0.15 to 1.00). Setting 0.12 (12%)
#   cleanly separates normal measurement fluctuation (< 10%) from clamping drops (>= 15%).
# Allowed range: (0.01, 0.50] | Typical values: 0.08 to 0.15 (8% to 15%) | Default: 0.12
speed_outlier_rel_tol = 0.12

# Temporal neighbor radius (in scans) for Stage 2 direction-compatible vector smoothing.
# Why & How chosen:
#   After Stage 1 removes isolated spikes, Stage 2 averages velocity vectors across
#   [i - radius, ..., i + radius]. Radius = 1 forms a compact 3-point window [i-1, i, i+1]
#   that reduces residual white velocity variance by a factor of 3 (std dev reduced by
#   sqrt(3) ~ 1.73x) with minimal temporal lag across maneuver boundaries.
# Allowed values: Integer >= 0 (0 disables Stage 2, 1 = 3-pt window, 2 = 5-pt window) | Default: 1
smooth_neighbor_radius = 1

# Maximum angular heading difference (in degrees) between adjacent velocity vectors to average them together
# (Bilateral / Edge-Preserving directional gate).
# Why & How chosen:
#   1) Physical Radar Error Propagation (2-sigma derivation):
#      Given horizontal position error sigma_xy = 2.0 m, the displacement vector between
#      two consecutive scans (dt = 1 s) has transverse error std dev sqrt(2) * sigma_xy
#      = 2.83 m. For a target cruising at v ~ 25 m/s (Delta d = 25 m per scan), the
#      1-sigma angular heading noise is:
#        sigma_theta = arctan(sqrt(2) * sigma_xy / (v * dt)) = arctan(2.83 / 25) = 6.45 deg
#      Therefore, the 95% (2-sigma) confidence bound for pure radar measurement noise on a
#      straight segment is 2 * sigma_theta = 12.9 deg ~ 12.0 deg!
#   2) Empirical Validation on plots.json:
#      Across all straight segments of T1-T4, 99% of scan-to-scan heading variations are
#      <= 7.39 deg, whereas the smallest real trajectory turn (each vertex of T4's 20-sided
#      polygon loop) is 18.0 to 22.0 deg, and T2/T3 turns are 45 to 90 deg. Setting
#      max_heading_diff_deg = 12.0 deg sits right in the middle of the [7.4 deg, 18.0 deg]
#      separation gap: it averages out measurement jitter (< 12 deg) while refusing to blend
#      vectors across real turns (>= 18 deg), preventing artificial speed drops at corners!
# Allowed range: (1.0, 90.0] | Typical values: 8.0 to 15.0 | Default: 12.0
max_heading_diff_deg = 12.0

# Number of decimal places for rounding speed_mps and heading_deg in tracks.json.
# Why & How chosen:
#   Matches standard aviation/radar telemetry precision (0.01 m/s and 0.01 deg), which is
#   two orders of magnitude finer than the physical radar uncertainty while keeping JSON
#   outputs clean and human-readable.
# Allowed values: Integer in [1, 6] | Default: 2
output_decimals = 2
